<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill Manager banner">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="#0a0a0a"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- faint oversized hexagon motif, right side -->
  <g opacity="0.5">
    <path d="M1040 40 L1180 120 L1180 280 L1040 360 L900 280 L900 120 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M1040 100 L1140 155 L1140 265 L1040 320 L940 265 L940 155 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  </g>

  <!-- logo badge -->
  <g transform="translate(90, 128)">
    <rect x="0" y="0" width="144" height="144" rx="32" fill="#000000" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M72 24 L112.5 47 L112.5 93 L72 116 L31.5 93 L31.5 47 Z"
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M52 58 L72 73 L52 88" fill="none" stroke="#ffffff" stroke-width="6.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="80" y="80" width="18" height="6.5" rx="1.5" fill="#ffffff"/>
  </g>

  <!-- wordmark + copy -->
  <g fill="#ffffff" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="270" y="192" font-size="64" font-weight="700" letter-spacing="-1.5">Skill Manager</text>
    <text x="272" y="232" font-size="21" font-weight="400" fill-opacity="0.62" letter-spacing="0.2">
      One dashboard to manage every AI coding agent skill you've installed
    </text>

    <!-- tag row -->
    <g font-size="15" font-weight="500" fill-opacity="0.85" font-family="'SF Mono', 'Fira Code', Consolas, monospace">
      <rect x="272" y="256" width="120" height="30" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="286" y="276">Claude Code</text>

      <rect x="404" y="256" width="80" height="30" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="418" y="276">Codex</text>

      <rect x="496" y="256" width="86" height="30" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="510" y="276">Cursor</text>

      <rect x="594" y="256" width="112" height="30" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="608" y="276">OpenCode</text>
    </g>
  </g>

  <!-- right edge fade so hexagon motif doesn't feel clipped -->
  <rect width="1280" height="400" fill="url(#fade)"/>

  <!-- border -->
  <rect x="1" y="1" width="1278" height="398" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
</svg>
