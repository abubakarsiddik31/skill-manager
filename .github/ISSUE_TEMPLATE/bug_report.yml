name: Bug report
description: Something isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which tool's skills were you managing
      options:
        - Claude Code
        - Codex
        - Cursor
        - OpenCode
        - Not tool-specific
      multiple: true
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Skill Manager version
      placeholder: e.g. v0.1.0 (the release you downloaded)
    validations:
      required: true
